<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Source Board</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%232b57e6'/%3E%3Cpath d='M9 10h14M9 16h14M9 22h8' stroke='white' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f6fa; --surface: #ffffff; --side: #ffffff; --ink: #172033; --muted: #5f6b81; --line: #e3e8f0;
    --accent: #2b57e6; --accent-ink: #ffffff; --accent-soft: #e8eeff; --danger: #c8332b; --danger-soft: #fdecea;
    --shadow: 0 1px 2px rgba(23,32,51,.06), 0 8px 24px rgba(23,32,51,.06); --radius: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1522; --surface: #171f31; --side: #131a2a; --ink: #e8ecf5; --muted: #98a3b8; --line: #263049;
      --accent: #6b8cff; --accent-ink: #0b1226; --accent-soft: #1d2a4d; --danger: #ff7b72; --danger-soft: #3a1f24;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1522; --surface: #171f31; --side: #131a2a; --ink: #e8ecf5; --muted: #98a3b8; --line: #263049;
    --accent: #6b8cff; --accent-ink: #0b1226; --accent-soft: #1d2a4d; --danger: #ff7b72; --danger-soft: #3a1f24;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .app { display: grid; grid-template-columns: 280px 1fr; height: 100%; }

  .side { background: var(--side); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 20px 20px 10px; font-weight: 700; font-size: 17px; letter-spacing: -.01em; border: 0; background: none; text-align: left; width: 100%; }
  .logo { width: 30px; height: 30px; border-radius: 9px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; }
  .homeitem { margin: 6px 12px 2px; }
  .side-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 20px 6px; color: var(--muted); font-size: 13px; font-weight: 600; }
  .icon-btn { width: 32px; height: 32px; border-radius: 8px; border: 1px solid transparent; background: transparent; display: inline-grid; place-items: center; color: var(--muted); }
  .icon-btn:hover { background: var(--accent-soft); color: var(--accent); }
  .icon-btn.danger:hover { background: var(--danger-soft); color: var(--danger); }
  .plist { list-style: none; margin: 0; padding: 4px 12px 16px; overflow-y: auto; flex: 1; }
  .pitem { width: 100%; display: flex; align-items: center; gap: 10px; text-align: left; padding: 9px 10px; border-radius: 9px; border: 0; background: transparent; color: var(--ink); }
  .pitem:hover { background: var(--bg); }
  .pitem[aria-current="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .pitem .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; opacity: .55; flex: none; }
  .pitem .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pitem .count { font-size: 12px; color: var(--muted); font-weight: 500; }
  .side-empty { padding: 8px 10px; color: var(--muted); font-size: 13.5px; }
  .side-foot { padding: 12px 16px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: 12.5px; }

  .main { overflow-y: auto; min-width: 0; }
  .topbar { display: none; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--side); position: sticky; top: 0; z-index: 5; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 40px 32px 64px; }

  .btn { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: 14px; }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn:disabled { opacity: .6; cursor: default; }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .btn.primary:hover { filter: brightness(1.08); color: var(--accent-ink); }
  .btn.danger { background: var(--danger); color: #fff; border-color: var(--danger); }
  .btn.danger:hover { filter: brightness(1.08); color: #fff; }
  .btn.big { height: 48px; padding: 0 22px; font-size: 15px; border-radius: 12px; }
  .back { display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; color: var(--muted); font-weight: 600; font-size: 14px; padding: 4px 8px 4px 0; margin-bottom: 14px; }
  .back:hover { color: var(--accent); }

  .home { min-height: calc(100vh - 140px); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 8px; padding: 24px 0; }
  .home h1 { font-size: 30px; letter-spacing: -.02em; margin: 0; }
  .home p { color: var(--muted); margin: 0 0 18px; max-width: 42ch; }
  .recent { margin-top: 40px; width: 100%; text-align: left; }
  .recent h2 { font-size: 14px; color: var(--muted); font-weight: 600; margin: 0 0 12px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
  .pcard { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius); padding: 16px; }
  .pcard:hover { border-color: var(--accent); box-shadow: var(--shadow); }
  .pcard b { display: block; font-size: 15px; margin-bottom: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pcard span { color: var(--muted); font-size: 13px; }

  .phead { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 28px; }
  .phead h1 { margin: 0; font-size: 28px; letter-spacing: -.02em; overflow-wrap: anywhere; }
  .phead .sub { color: var(--muted); font-size: 14px; margin-top: 2px; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; gap: 12px; }
  .toolbar h2 { margin: 0; font-size: 16px; }

  .sources { display: grid; gap: 12px; }
  .src { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 16px 16px 18px; display: flex; gap: 12px; align-items: flex-start; }
  .src:hover { box-shadow: var(--shadow); }
  .src .body { flex: 1; min-width: 0; }
  .src h3 { margin: 0 0 4px; font-size: 16px; overflow-wrap: anywhere; }
  .src p { margin: 0 0 10px; color: var(--muted); white-space: pre-wrap; overflow-wrap: anywhere; }
  .src a { display: inline-flex; align-items: center; gap: 6px; color: var(--accent); text-decoration: none; font-size: 13.5px; font-weight: 600; background: var(--accent-soft); padding: 4px 10px; border-radius: 999px; max-width: 100%; }
  .src a span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .src a:hover { text-decoration: underline; }
  .src .row-actions { display: flex; gap: 2px; flex: none; }

  .empty { border: 1.5px dashed var(--line); border-radius: var(--radius); padding: 44px 20px; text-align: center; color: var(--muted); }
  .empty p { margin: 0 0 16px; }
  .notice { max-width: 560px; margin: 60px auto; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 28px; box-shadow: var(--shadow); }
  .notice h2 { margin: 0 0 8px; }
  .notice p { color: var(--muted); margin: 0 0 16px; }
  .notice code { background: var(--bg); padding: 2px 6px; border-radius: 6px; font-size: 13px; }
  .notice.lock { max-width: 420px; }
  .notice.lock .btn { width: 100%; justify-content: center; margin-top: 4px; }
  .loading { padding: 80px 0; text-align: center; color: var(--muted); }

  .overlay { position: fixed; inset: 0; background: rgba(10,16,30,.5); display: grid; place-items: center; padding: 16px; z-index: 50; }
  .modal { background: var(--surface); width: 100%; max-width: 460px; border-radius: 16px; box-shadow: 0 24px 60px rgba(0,0,0,.3); padding: 24px; animation: pop .16s ease-out; }
  @keyframes pop { from { transform: scale(.97); opacity: 0; } to { transform: none; opacity: 1; } }
  .modal h2 { margin: 0 0 4px; font-size: 20px; letter-spacing: -.01em; }
  .modal .hint { margin: 0 0 18px; color: var(--muted); font-size: 14px; }
  .field { display: grid; gap: 6px; margin-bottom: 14px; }
  .field label { font-size: 13.5px; font-weight: 600; }
  .field input, .field textarea { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; width: 100%; }
  .field textarea { min-height: 88px; resize: vertical; }
  .field input:focus, .field textarea:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: var(--accent); }
  .err { color: var(--danger); font-size: 13px; }
  .form-err { margin-bottom: 8px; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; }

  .toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; font-weight: 500; z-index: 60; box-shadow: var(--shadow); }

  .scrim { display: none; }
  @media (max-width: 800px) {
    .app { grid-template-columns: 1fr; }
    .side { position: fixed; inset: 0 auto 0 0; width: 285px; max-width: 86vw; z-index: 40; transform: translateX(-102%); transition: transform .2s ease; }
    .side.open { transform: none; box-shadow: var(--shadow); }
    .scrim.show { display: block; position: fixed; inset: 0; background: rgba(10,16,30,.4); z-index: 30; }
    .topbar { display: flex; }
    .wrap { padding: 24px 16px 48px; }
    .home { min-height: calc(100vh - 200px); }
  }
  @media (prefers-reduced-motion: reduce) { .modal { animation: none; } .side { transition: none; } }
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side" aria-label="Projects">
    <button class="brand" id="brandBtn" aria-label="Go to dashboard">
      <span class="logo" aria-hidden="true">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16M4 12h16M4 19h10"/></svg>
      </span>
      Source Board
    </button>
    <div class="homeitem"><button class="pitem" id="homeBtn"><span class="dot"></span><span class="name">Dashboard</span></button></div>
    <div class="side-head">
      <span>Projects</span>
      <button class="icon-btn" id="sideAdd" aria-label="Add project" title="Add project">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </div>
    <ul class="plist" id="plist"></ul>
    <div class="side-foot">
      <span id="stats"></span>
      <span>
        <button class="icon-btn" id="lockBtn" aria-label="Lock" title="Lock (forget passcode on this device)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
        </button>
        <button class="icon-btn" id="themeBtn" aria-label="Switch theme" title="Switch theme">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
      </span>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <main class="main" id="mainScroll">
    <div class="topbar">
      <button class="icon-btn" id="menuBtn" aria-label="Open projects">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <strong>Source Board</strong>
    </div>
    <div class="wrap" id="view"></div>
  </main>
</div>

<script>
(function () {
  /* ===== 1) SUPABASE CONFIG: paste your own values here ===== */
  var SUPABASE_URL = 'https://dlgrldoqkkflenecdnoc.supabase.co';       // e.g. https://abcdxyz.supabase.co
  var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRsZ3JsZG9xa2tmbGVuZWNkbm9jIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA1NDE1OTAsImV4cCI6MjEwNjExNzU5MH0.SRrwibUlg5L8rwTmJCpzZTluSzRiA3IRZTB9s-8UEIc';     // Project Settings > API > anon public key
  /* ========================================================= */

  var configured = SUPABASE_URL.indexOf('http') === 0 && SUPABASE_ANON_KEY.indexOf('PASTE') !== 0;
  var PASS_KEY = 'source-board-passcode';
  var state = { projects: [], loaded: false, error: '', passcode: '', locked: true, lockMsg: '' };
  try { state.passcode = localStorage.getItem(PASS_KEY) || ''; } catch (e) {}
  state.locked = !state.passcode;
  var lastSnapshot = '';

  /* ---------- API (plain fetch to Supabase REST) ---------- */
  function api(path, method, body) {
    var headers = { apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + SUPABASE_ANON_KEY, 'Content-Type': 'application/json', 'x-team-passcode': state.passcode };
    if (method === 'POST' || method === 'PATCH') headers.Prefer = 'return=representation';
    return fetch(SUPABASE_URL.replace(/\/$/, '') + '/rest/v1/' + path, {
      method: method || 'GET', headers: headers, body: body ? JSON.stringify(body) : undefined
    }).then(function (res) {
      if (!res.ok) {
        return res.json().catch(function () { return {}; }).then(function (j) {
          if (res.status === 401 || res.status === 403) throw new Error('Access denied. Lock and unlock again with the current passcode.');
          throw new Error(j.message || ('Request failed (' + res.status + ')'));
        });
      }
      if (res.status === 204) return null;
      return res.text().then(function (t) { return t ? JSON.parse(t) : null; });
    });
  }

  function loadData(silent) {
    if (state.locked) return Promise.resolve();
    // The server decides whether the passcode is right; this only asks it.
    return api('rpc/has_valid_passcode', 'POST', {}).then(function (ok) {
      if (ok !== true) { lockApp('The passcode is no longer valid. Enter it again.'); return; }
      return api('projects?select=*,sources(*)&order=created_at.asc&sources.order=created_at.desc').then(function (rows) {
        var snap = JSON.stringify(rows);
        state.loaded = true; state.error = '';
        if (snap === lastSnapshot && silent) return;
        lastSnapshot = snap;
        state.projects = rows || [];
        render();
      });
    }).catch(function (e) {
      if (silent && state.loaded) return;
      state.loaded = true; state.error = e.message || 'Could not load data.';
      render();
    });
  }

  function lockApp(msg) {
    state.passcode = ''; state.locked = true; state.projects = []; lastSnapshot = ''; state.error = '';
    state.lockMsg = msg || '';
    try { localStorage.removeItem(PASS_KEY); } catch (e) {}
    if (location.hash) location.hash = '';
    render();
  }
  function tryUnlock(value) {
    state.passcode = value;
    return api('rpc/has_valid_passcode', 'POST', {}).then(function (ok) {
      if (ok === true) {
        try { localStorage.setItem(PASS_KEY, value); } catch (e) {}
        state.locked = false; state.lockMsg = ''; state.loaded = false; state.error = '';
        render();
        loadData();
        return true;
      }
      state.passcode = '';
      return false;
    }).catch(function (e) { state.passcode = ''; throw e; });
  }

  /* ---------- Routing (#/p/<id>) so browser Back works and links can be shared ---------- */
  function activeId() { var m = location.hash.match(/^#\/p\/(.+)$/); return m ? m[1] : null; }
  function active() { var id = activeId(); return state.projects.find(function (p) { return p.id === id; }) || null; }
  function goHome() { if (location.hash) location.hash = ''; else render(); closeSide(); }
  function goProject(id) { location.hash = '#/p/' + id; closeSide(); }
  window.addEventListener('hashchange', function () { render(); document.getElementById('mainScroll').scrollTop = 0; });

  /* ---------- Helpers ---------- */
  function h(tag, attrs, children) {
    var el = document.createElement(tag);
    attrs = attrs || {};
    Object.keys(attrs).forEach(function (k) {
      if (k === 'class') el.className = attrs[k];
      else if (k === 'text') el.textContent = attrs[k];
      else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), attrs[k]);
      else el.setAttribute(k, attrs[k]);
    });
    (children || []).forEach(function (c) { if (c) el.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return el;
  }
  var ICONS = {
    plus: '<path d="M12 5v14M5 12h14"/>',
    edit: '<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
    trash: '<path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/>',
    link: '<path d="M10 13a5 5 0 0 0 7.1 0l3-3a5 5 0 0 0-7.1-7.1l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.1 0l-3 3a5 5 0 0 0 7.1 7.1l1.7-1.7"/>',
    back: '<path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/>'
  };
  function icon(path, size) {
    var s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    s.setAttribute('width', size || 18); s.setAttribute('height', size || 18);
    s.setAttribute('viewBox', '0 0 24 24'); s.setAttribute('fill', 'none');
    s.setAttribute('stroke', 'currentColor'); s.setAttribute('stroke-width', '2');
    s.setAttribute('stroke-linecap', 'round'); s.setAttribute('stroke-linejoin', 'round');
    s.innerHTML = path; return s;
  }
  function plural(n, w) { return n + ' ' + w + (n === 1 ? '' : 's'); }
  function normalizeUrl(u) { u = (u || '').trim(); if (!u) return ''; if (!/^[a-z][a-z0-9+.-]*:/i.test(u)) u = 'https://' + u; return u; }
  function safeUrl(u) { return /^https?:\/\//i.test(u); }
  function hostOf(u) { try { return new URL(u).hostname.replace(/^www\./, ''); } catch (e) { return u; } }

  var toastTimer;
  function toast(msg) {
    var old = document.querySelector('.toast'); if (old) old.remove();
    var t = h('div', { class: 'toast', role: 'status', text: msg });
    document.body.appendChild(t);
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.remove(); }, 2200);
  }

  /* ---------- Modal ---------- */
  var lastFocus = null;
  function closeModal() {
    var o = document.querySelector('.overlay'); if (o) o.remove();
    document.removeEventListener('keydown', onKey);
    if (lastFocus && document.body.contains(lastFocus) && lastFocus.focus) lastFocus.focus();
  }
  function onKey(e) { if (e.key === 'Escape') closeModal(); }

  function openModal(cfg) {
    lastFocus = document.activeElement;
    var form = h('form', { novalidate: 'novalidate' });
    var inputs = {};
    (cfg.fields || []).forEach(function (f) {
      var id = 'f_' + f.name;
      var input = f.type === 'textarea' ? h('textarea', { id: id, placeholder: f.placeholder || '' }) : h('input', { id: id, type: 'text', placeholder: f.placeholder || '', autocomplete: 'off' });
      input.value = f.value || ''; inputs[f.name] = input;
      form.appendChild(h('div', { class: 'field' }, [h('label', { for: id, text: f.label + (f.required ? '' : ' (optional)') }), input, h('div', { class: 'err', id: id + '_err' })]));
    });
    var formErr = h('div', { class: 'err form-err', role: 'alert' });
    var cancel = h('button', { type: 'button', class: 'btn', text: 'Cancel', onclick: closeModal });
    var ok = h('button', { type: 'submit', class: 'btn ' + (cfg.danger ? 'danger' : 'primary'), text: cfg.submit });
    form.appendChild(formErr);
    form.appendChild(h('div', { class: 'modal-actions' }, [cancel, ok]));
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var values = {}, bad = false;
      (cfg.fields || []).forEach(function (f) {
        var v = inputs[f.name].value.trim();
        var errEl = document.getElementById('f_' + f.name + '_err'); errEl.textContent = '';
        if (f.required && !v) { errEl.textContent = f.label + ' is required.'; bad = true; }
        values[f.name] = v;
      });
      if (bad) { var first = form.querySelector('.field .err:not(:empty)'); if (first) first.previousSibling.focus(); return; }
      formErr.textContent = ''; ok.disabled = true; cancel.disabled = true; ok.textContent = 'Saving...';
      Promise.resolve(cfg.onSubmit(values)).then(closeModal).catch(function (err) {
        ok.disabled = false; cancel.disabled = false; ok.textContent = cfg.submit;
        formErr.textContent = 'Could not save: ' + (err && err.message ? err.message : 'unknown error');
      });
    });
    var modal = h('div', { class: 'modal', role: 'dialog', 'aria-modal': 'true', 'aria-label': cfg.title }, [
      h('h2', { text: cfg.title }), cfg.hint ? h('p', { class: 'hint', text: cfg.hint }) : null, form
    ]);
    var overlay = h('div', { class: 'overlay', onmousedown: function (e) { if (e.target === overlay) closeModal(); } }, [modal]);
    document.body.appendChild(overlay);
    document.addEventListener('keydown', onKey);
    var firstInput = form.querySelector('input, textarea');
    (firstInput || ok).focus();
    if (firstInput && firstInput.select) firstInput.select();
  }

  /* ---------- Actions (all saved to Supabase) ---------- */
  function addProject() {
    if (state.locked) return;
    openModal({
      title: 'Add project', hint: 'Give your project a name. You can rename it later.', submit: 'Add project',
      fields: [{ name: 'name', label: 'Project name', required: true, placeholder: 'e.g. Malware detection thesis' }],
      onSubmit: function (v) {
        return api('projects', 'POST', { name: v.name }).then(function (rows) {
          return loadData().then(function () { if (rows && rows[0]) goProject(rows[0].id); toast('Project added'); });
        });
      }
    });
  }
  function renameProject() {
    var p = active(); if (!p) return;
    openModal({
      title: 'Rename project', submit: 'Save name',
      fields: [{ name: 'name', label: 'Project name', required: true, value: p.name }],
      onSubmit: function (v) { return api('projects?id=eq.' + p.id, 'PATCH', { name: v.name }).then(function () { return loadData().then(function () { toast('Project renamed'); }); }); }
    });
  }
  function deleteProject() {
    var p = active(); if (!p) return;
    openModal({
      title: 'Delete project?', danger: true, submit: 'Delete project', fields: [],
      hint: '"' + p.name + '" and its ' + plural(p.sources.length, 'source') + ' will be removed for everyone. This can\'t be undone.',
      onSubmit: function () {
        return api('projects?id=eq.' + p.id, 'DELETE').then(function () { location.hash = ''; return loadData().then(function () { toast('Project deleted'); }); });
      }
    });
  }
  function sourceModal(existing) {
    var p = active(); if (!p) return;
    openModal({
      title: existing ? 'Edit source' : 'Add source', submit: existing ? 'Save source' : 'Add source',
      fields: [
        { name: 'title', label: 'Title', required: true, value: existing && existing.title, placeholder: 'e.g. Image-based malware detection survey' },
        { name: 'desc', label: 'Description', type: 'textarea', value: existing && existing.description, placeholder: 'What is this source about?' },
        { name: 'url', label: 'Link', value: existing && existing.url, placeholder: 'https://...' }
      ],
      onSubmit: function (v) {
        var payload = { title: v.title, description: v.desc, url: normalizeUrl(v.url) };
        var req = existing ? api('sources?id=eq.' + existing.id, 'PATCH', payload) : api('sources', 'POST', Object.assign({ project_id: p.id }, payload));
        return req.then(function () { return loadData().then(function () { toast(existing ? 'Source updated' : 'Source added'); }); });
      }
    });
  }
  function deleteSource(s) {
    openModal({
      title: 'Delete source?', danger: true, submit: 'Delete source', fields: [],
      hint: '"' + s.title + '" will be removed for everyone.',
      onSubmit: function () { return api('sources?id=eq.' + s.id, 'DELETE').then(function () { return loadData().then(function () { toast('Source deleted'); }); }); }
    });
  }

  /* ---------- Render ---------- */
  function renderSide() {
    var list = document.getElementById('plist'); list.innerHTML = '';
    var cur = activeId();
    document.getElementById('homeBtn').setAttribute('aria-current', String(!cur));
    if (!state.projects.length) {
      list.appendChild(h('li', { class: 'side-empty', text: state.locked ? 'Locked' : (state.loaded ? 'No projects yet.' : 'Loading...') }));
    } else {
      state.projects.forEach(function (p) {
        list.appendChild(h('li', {}, [h('button', { class: 'pitem', 'aria-current': String(p.id === cur), onclick: function () { goProject(p.id); } }, [
          h('span', { class: 'dot' }), h('span', { class: 'name', text: p.name }), h('span', { class: 'count', text: String(p.sources.length) })
        ])]));
      });
    }
    var total = state.projects.reduce(function (n, p) { return n + p.sources.length; }, 0);
    document.getElementById('stats').textContent = state.locked ? '' : plural(state.projects.length, 'project') + ', ' + plural(total, 'source');
    document.getElementById('sideAdd').style.visibility = state.locked ? 'hidden' : 'visible';
    document.getElementById('lockBtn').style.display = state.locked ? 'none' : 'inline-grid';
  }

  function renderSetup(view) {
    view.appendChild(h('div', { class: 'notice' }, [
      h('h2', { text: 'Connect Supabase to get started' }),
      h('p', { text: 'Open index.html and paste your Project URL and anon key at the top of the script.' }),
      h('p', {}, ['Look for ', h('code', { text: 'SUPABASE_URL' }), ' and ', h('code', { text: 'SUPABASE_ANON_KEY' }), '.'])
    ]));
  }
  function renderLock(view) {
    var input = h('input', { type: 'password', id: 'passInput', placeholder: 'Team passcode', autocomplete: 'current-password' });
    var err = h('div', { class: 'err', role: 'alert', text: state.lockMsg || '' });
    var btn = h('button', { type: 'submit', class: 'btn primary big', text: 'Unlock' });
    function reset(msg) { btn.disabled = false; btn.textContent = 'Unlock'; err.textContent = msg; }
    var form = h('form', { novalidate: 'novalidate', onsubmit: function (e) {
      e.preventDefault();
      var v = input.value;
      if (!v) { err.textContent = 'Enter the team passcode.'; input.focus(); return; }
      if (!/^[\x20-\x7E]+$/.test(v)) { err.textContent = 'The passcode only uses standard letters, numbers and symbols.'; input.select(); return; }
      btn.disabled = true; btn.textContent = 'Checking...'; err.textContent = '';
      tryUnlock(v).then(function (ok) {
        if (!ok) { reset('Wrong passcode. Try again.'); input.select(); }
      }).catch(function (e2) { reset('Could not check the passcode: ' + (e2 && e2.message ? e2.message : 'no connection')); });
    } }, [
      h('div', { class: 'field' }, [h('label', { for: 'passInput', text: 'Passcode' }), input, err]),
      btn
    ]);
    view.appendChild(h('div', { class: 'notice lock' }, [
      h('h2', { text: 'Enter the team passcode' }),
      h('p', { text: 'Ask the project owner for the passcode to view and edit sources.' }),
      form
    ]));
    setTimeout(function () { input.focus(); }, 0);
  }
  function renderError(view) {
    view.appendChild(h('div', { class: 'notice' }, [
      h('h2', { text: 'Could not load your projects' }),
      h('p', { text: state.error + ' Check your Supabase URL, key and table setup, then try again.' }),
      h('button', { class: 'btn primary', text: 'Try again', onclick: function () { state.loaded = false; state.error = ''; render(); loadData(); } })
    ]));
  }
  function renderHome(view) {
    var box = h('div', { class: 'home' }, [
      h('h1', { text: state.projects.length ? 'Your dashboard' : 'Start your first project' }),
      h('p', { text: state.projects.length ? 'Open a project from the left, or start a new one.' : 'Create a project, then collect sources with a title, description and link.' }),
      h('button', { class: 'btn primary big', onclick: addProject }, [icon(ICONS.plus, 18), 'Add project'])
    ]);
    if (state.projects.length) {
      var grid = h('div', { class: 'grid' });
      state.projects.forEach(function (p) {
        grid.appendChild(h('button', { class: 'pcard', onclick: function () { goProject(p.id); } }, [h('b', { text: p.name }), h('span', { text: plural(p.sources.length, 'source') })]));
      });
      box.appendChild(h('div', { class: 'recent' }, [h('h2', { text: 'All projects' }), grid]));
    }
    view.appendChild(box);
  }
  function renderProject(view, p) {
    view.appendChild(h('button', { class: 'back', onclick: goHome }, [icon(ICONS.back, 16), 'Back to dashboard']));
    view.appendChild(h('div', { class: 'phead' }, [
      h('div', {}, [h('h1', { text: p.name }), h('div', { class: 'sub', text: plural(p.sources.length, 'source') })]),
      h('div', { class: 'actions' }, [
        h('button', { class: 'btn', onclick: renameProject }, [icon(ICONS.edit, 16), 'Rename']),
        h('button', { class: 'btn', onclick: deleteProject }, [icon(ICONS.trash, 16), 'Delete'])
      ])
    ]));
    view.appendChild(h('div', { class: 'toolbar' }, [
      h('h2', { text: 'Sources' }),
      h('button', { class: 'btn primary', onclick: function () { sourceModal(null); } }, [icon(ICONS.plus, 16), 'Add source'])
    ]));
    if (!p.sources.length) {
      view.appendChild(h('div', { class: 'empty' }, [
        h('p', { text: 'No sources in this project yet.' }),
        h('button', { class: 'btn primary', onclick: function () { sourceModal(null); } }, [icon(ICONS.plus, 16), 'Add source'])
      ]));
      return;
    }
    var wrap = h('div', { class: 'sources' });
    p.sources.forEach(function (s) {
      var body = h('div', { class: 'body' }, [h('h3', { text: s.title })]);
      if (s.description) body.appendChild(h('p', { text: s.description }));
      if (s.url) {
        if (safeUrl(s.url)) body.appendChild(h('a', { href: s.url, target: '_blank', rel: 'noopener noreferrer' }, [icon(ICONS.link, 14), h('span', { text: hostOf(s.url) })]));
        else body.appendChild(h('p', { text: s.url }));
      }
      wrap.appendChild(h('article', { class: 'src' }, [
        body,
        h('div', { class: 'row-actions' }, [
          h('button', { class: 'icon-btn', 'aria-label': 'Edit source', title: 'Edit', onclick: function () { sourceModal(s); } }, [icon(ICONS.edit, 17)]),
          h('button', { class: 'icon-btn danger', 'aria-label': 'Delete source', title: 'Delete', onclick: function () { deleteSource(s); } }, [icon(ICONS.trash, 17)])
        ])
      ]));
    });
    view.appendChild(wrap);
  }

  function render() {
    renderSide();
    var view = document.getElementById('view'); view.innerHTML = '';
    if (!configured) return renderSetup(view);
    if (state.locked) return renderLock(view);
    if (state.error) return renderError(view);
    if (!state.loaded) { view.appendChild(h('div', { class: 'loading', text: 'Loading your projects...' })); return; }
    var p = active();
    if (p) renderProject(view, p); else renderHome(view);
  }

  /* ---------- Sidebar, theme, auto refresh ---------- */
  function openSide() { document.getElementById('side').classList.add('open'); document.getElementById('scrim').classList.add('show'); }
  function closeSide() { document.getElementById('side').classList.remove('open'); document.getElementById('scrim').classList.remove('show'); }
  document.getElementById('menuBtn').addEventListener('click', openSide);
  document.getElementById('scrim').addEventListener('click', closeSide);
  document.getElementById('sideAdd').addEventListener('click', addProject);
  document.getElementById('homeBtn').addEventListener('click', goHome);
  document.getElementById('brandBtn').addEventListener('click', goHome);
  document.getElementById('lockBtn').addEventListener('click', function () { lockApp(''); closeSide(); });
  document.getElementById('themeBtn').addEventListener('click', function () {
    var root = document.documentElement;
    var dark = root.getAttribute('data-theme') === 'dark' || (!root.getAttribute('data-theme') && window.matchMedia('(prefers-color-scheme: dark)').matches);
    var next = dark ? 'light' : 'dark'; root.setAttribute('data-theme', next);
    try { localStorage.setItem('source-board-theme', next); } catch (e) {}
  });
  try { var t = localStorage.getItem('source-board-theme'); if (t) document.documentElement.setAttribute('data-theme', t); } catch (e) {}

  // Teammates' changes show up automatically
  if (configured) {
    setInterval(function () { if (!document.hidden && !state.locked && !document.querySelector('.overlay')) loadData(true); }, 15000);
    document.addEventListener('visibilitychange', function () { if (!document.hidden && !state.locked && !document.querySelector('.overlay')) loadData(true); });
  }

  render();
  if (configured && !state.locked) loadData();
})();
</script>
</body>
</html>
